services:
  rp-s3:
    build: .
    image: exampleorg/rp-s3:latest
    container_name: rp-s3
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Token do endpoint PUT /upload — mesmo valor guardado como secret
      # RP_S3_UPLOAD_TOKEN no repo do GitHub. Sem ele, upload fica desligado.
      - UPLOAD_TOKEN=${UPLOAD_TOKEN:-}
    volumes:
      # Montados rw: o CI publica latest.json/appcast via PUT /upload.
      # Host: /home/user/cockpit/data/latest.json
      # URL:  https://rp-s3.example.invalid/downloads/cockpit/latest.json
      - /home/user/cockpit/data:/data/cockpit
      # Manifest do app mobile (APK Android, plano 44).
      # URL: https://rp-s3.example.invalid/downloads/app/latest.json
      - /home/user/app/data:/data/app
