name: Build iOS IPA
on: workflow_dispatch

# Pinado de proposito. `channel: stable` sem versao resolve hoje para um stable
# bem mais novo (3.47.x) — o job pularia a fronteira 3.44.0, onde o Swift Package
# Manager passou a ser default-on e a integracao de plugins do iOS mudou. O
# `app-release.yml` pina a MESMA versao, para os dois jobs nao divergirem.
env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # 指定在 app 子目录下运行（如果子目录名为 mobile，请改为 mobile）
      - name: Flutter Pub Get
        working-directory: app
        run: flutter pub get

      # `--no-codesign` porque o CI nao tem certificado: o Flutter archiveia o
      # .app e para ai (nao exporta IPA). O .ipa sai no passo seguinte,
      # empacotado a mao.
      - name: Build (arquivo sem assinatura)
        working-directory: app
        run: flutter build ipa --no-codesign

      # Um .ipa e so um zip com Payload/Runner.app na raiz. Sem isso o artefato
      # seria o .app cru, que nao e instalavel por ferramenta de sideload.
      # A assinatura continua por sua conta (Sideloadly/AltStore/Xcode).
      - name: Empacotar .ipa
        working-directory: app
        run: |
          APP="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          test -d "$APP" || { echo "::error::archive nao gerou Runner.app"; exit 1; }
          rm -rf Payload RemotePi-unsigned.ipa
          mkdir -p Payload
          ditto "$APP" "Payload/Runner.app"
          zip -qry RemotePi-unsigned.ipa Payload
          echo '--- conteudo do ipa ---'
          unzip -l RemotePi-unsigned.ipa | head -20
          ls -lh RemotePi-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RemotePi-unsigned-ipa
          path: app/RemotePi-unsigned.ipa
          if-no-files-found: error
